name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: latest
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: lulianqi/dubbo-tester
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dubbo-tester
  ALIYUN_ACR_REGISTRY: crpi-ct3m45rpep0xlnep.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_ACR_IMAGE: crpi-ct3m45rpep0xlnep.cn-hangzhou.personal.cr.aliyuncs.com/lulianqi/dubbo-tester

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: lulianqi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH_LATEST: ${{ github.event_name == 'release' && github.event.release.prerelease == false || inputs.publish_latest }}
          RELEASE_EVENT: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EVENT" == "true" ]]; then
            IMAGE_TAG="${IMAGE_TAG#v}"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $IMAGE_TAG"
            exit 1
          fi

          # GHCR requires lowercase repository names.
          GHCR_IMAGE="${GHCR_IMAGE,,}"

          {
            echo 'value<<EOF'
            echo "$DOCKERHUB_IMAGE:$IMAGE_TAG"
            echo "$GHCR_IMAGE:$IMAGE_TAG"
            echo "$ALIYUN_ACR_IMAGE:$IMAGE_TAG"
            if [[ "$PUBLISH_LATEST" == "true" && "$IMAGE_TAG" != "latest" ]]; then
              echo "$DOCKERHUB_IMAGE:latest"
              echo "$GHCR_IMAGE:latest"
              echo "$ALIYUN_ACR_IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Alibaba Cloud personal ACR rejects the OCI empty manifests used by
          # BuildKit attestations, so keep the multi-arch image index portable.
          provenance: false
          sbom: false
